<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<title>トラック管理</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="トラック管理">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { --ink:#1e293b; --sub:#64748b; --line:#e2e8f0; --bg:#f1f5f9; --teal:#0d9488; --warn:#dc2626; --amber:#b45309; --ok:#16a34a; --sel:#f97316; }
  body { font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink); padding-bottom:calc(280px + env(safe-area-inset-bottom)); }
  header { background:linear-gradient(135deg,#1e293b,#334155); color:#fff; padding:14px 16px 12px; padding-top:calc(14px + env(safe-area-inset-top)); position:sticky; top:0; z-index:50; }
  header h1 { font-size:20px; }
  header .sub { font-size:11px; opacity:.7; margin-top:2px; letter-spacing:1px; }
  .tab-bar { display:flex; gap:6px; margin-top:10px; overflow-x:auto; }
  .tab-btn { flex:1; white-space:nowrap; padding:10px 6px; border:none; border-radius:10px; background:rgba(255,255,255,.12); color:#cbd5e1; font-size:14px; font-weight:700; font-family:inherit; }
  .tab-btn.active { background:var(--teal); color:#fff; }
  .wrap { max-width:960px; margin:0 auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .card { background:#fff; border-radius:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); padding:12px; }
  .help summary { font-weight:700; color:var(--teal); cursor:pointer; font-size:14px; }
  .help ol { margin:8px 0 0 1.3em; font-size:13px; line-height:1.8; color:#334155; }
  .help p { font-size:12px; color:var(--sub); margin-top:6px; line-height:1.7; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .btn { border:none; border-radius:10px; padding:9px 12px; font-size:14px; font-weight:700; font-family:inherit; background:#e2e8f0; color:var(--ink); cursor:pointer; text-decoration:none; display:inline-block; }
  .btn.main { background:var(--teal); color:#fff; }
  .btn.edit-on { background:var(--sel); color:#fff; }
  .btn.danger { background:#fee2e2; color:var(--warn); }
  .btn.small { padding:6px 10px; font-size:13px; }
  .spacer { flex:1; }
  .chk { font-size:13px; display:flex; align-items:center; gap:4px; color:#334155; }
  .zoom { display:flex; align-items:center; gap:4px; font-size:12px; color:var(--sub); }
  .stage { background:#cbd5d0; border-radius:14px; overflow:auto; max-height:72vh; position:relative; -webkit-overflow-scrolling:touch; }
  .stage.placing svg { cursor:crosshair; }
  .stage svg { display:block; user-select:none; -webkit-user-select:none; }
  .edit .item, .edit .handle { cursor:grab; touch-action:none; }
  .status { font-size:12px; color:var(--sub); line-height:1.6; }
  h3.lbl { font-size:13px; color:var(--sub); margin-bottom:6px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 10px; font-size:13px; font-family:inherit; color:var(--ink); }
  .chip small { color:var(--sub); margin-left:4px; }
  .chip.temp { border-style:dashed; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:13px; }
  .row input[type=number], .row input[type=text] { width:76px; padding:7px 8px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; font-family:inherit; }
  .row input[type=text] { width:110px; }
  input[type=range] { accent-color:var(--teal); }
  .dock { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); box-shadow:0 -4px 16px rgba(0,0,0,.08); z-index:60;
          padding:10px 12px calc(10px + env(safe-area-inset-bottom)); max-height:55vh; overflow:auto; }
  .dock .in { max-width:960px; margin:0 auto; display:flex; flex-direction:column; gap:8px; }
  .dock .name { font-weight:800; font-size:16px; }
  .dock .meta { font-size:12px; color:var(--sub); }
  .gaps { font-size:13px; display:flex; flex-wrap:wrap; gap:6px; }
  .gap { padding:3px 8px; border-radius:999px; background:#f1f5f9; }
  .gap.bad { background:#fee2e2; color:var(--warn); font-weight:700; }
  .gap.good { background:#dcfce7; color:#166534; }
  .tag { display:inline-block; font-size:12px; padding:3px 8px; border-radius:999px; background:#e2e8f0; white-space:nowrap; font-weight:700; }
  .tag.red { background:#fee2e2; color:#b91c1c; }
  .tag.amber { background:#fef3c7; color:#92400e; }
  .tag.blue { background:#dbeafe; color:#1e40af; }
  .tag.green { background:#dcfce7; color:#166534; }
  .tag.l1 { background:#ccfbf1; color:#115e59; }
  .tag.l2 { background:#e0e7ff; color:#3730a3; }
  .vrow { display:flex; gap:10px; align-items:center; padding:12px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .vrow:last-child { border-bottom:none; }
  .vrow .nm { font-weight:800; font-size:16px; }
  .vrow .mt { font-size:12px; color:var(--sub); }
  .vrow .tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .vrow .go { margin-left:auto; color:#94a3b8; font-size:20px; }
  .filters { display:flex; flex-wrap:wrap; gap:6px; }
  .filters button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 12px; font-size:13px; font-family:inherit; font-weight:700; color:var(--sub); }
  .filters button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .home-sum { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .sumbox { background:#fff; border-radius:14px; padding:12px 8px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.06); border:none; font-family:inherit; cursor:pointer; }
  .sumbox .n { font-size:28px; font-weight:800; }
  .sumbox .l { font-size:12px; color:var(--sub); font-weight:700; }
  .sumbox.red .n { color:#b91c1c; } .sumbox.amber .n { color:#b45309; } .sumbox.blue .n { color:#1d4ed8; }
  .menu { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media (max-width:520px){ .menu { grid-template-columns:1fr; } }
  .menu button { background:#fff; border:none; border-radius:14px; padding:16px; text-align:left; font-family:inherit; box-shadow:0 1px 3px rgba(0,0,0,.06); cursor:pointer; }
  .menu .t { font-size:17px; font-weight:800; color:var(--ink); }
  .menu .d { font-size:12px; color:var(--sub); margin-top:4px; line-height:1.6; }
  .links { display:flex; flex-wrap:wrap; gap:8px; }
  /* カルテ */
  .karte { position:fixed; inset:0; background:var(--bg); z-index:80; overflow:auto; padding-bottom:calc(40px + env(safe-area-inset-bottom)); }
  .karte-head { position:sticky; top:0; background:linear-gradient(135deg,#1e293b,#334155); color:#fff; padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top)); display:flex; gap:10px; align-items:center; z-index:2; }
  .karte-head h2 { font-size:19px; }
  .karte-head .s { font-size:12px; opacity:.75; }
  .sec h4 { font-size:15px; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .sec h4 .more { margin-left:auto; font-size:12px; font-weight:700; color:var(--teal); text-decoration:none; }
  .kv { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px 12px; font-size:14px; }
  .kv div span { display:block; font-size:11px; color:var(--sub); }
  .hist { font-size:13px; display:flex; flex-direction:column; }
  .hist > div { display:grid; grid-template-columns:86px 1fr; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); }
  .hist > div:last-child { border-bottom:none; }
  .hist .d { color:var(--sub); font-variant-numeric:tabular-nums; }
  .ckgrid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; font-size:11px; text-align:center; }
  .ck { border-radius:8px; padding:5px 2px; background:#f1f5f9; }
  .ck b { display:block; font-size:12px; }
  .ck.full { background:#dcfce7; } .ck.half { background:#fef3c7; } .ck.none { background:#fee2e2; } .ck.off { background:#f8fafc; color:#cbd5e1; }
  .note { font-size:12px; color:var(--sub); margin-top:6px; line-height:1.6; }
  .toast { position:fixed; left:50%; top:calc(130px + env(safe-area-inset-top)); transform:translateX(-50%); background:#1e293b; color:#fff; padding:10px 16px; border-radius:999px; font-size:14px; z-index:100; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; }
  .toast.show { opacity:1; }
  .banner { background:#fff7ed; border:2px solid #fdba74; border-radius:14px; padding:10px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .banner b { color:#c2410c; }
  .saves { display:flex; flex-direction:column; }
  .saves > div { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .saves > div:last-child { border-bottom:none; }
  .saves .nm { font-weight:800; flex:1; min-width:160px; }
  .saves .nm small { display:block; font-weight:400; color:var(--sub); font-size:12px; }
  .modal-bg { position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:90; display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal { background:#fff; border-radius:16px; padding:18px; width:100%; max-width:440px; display:flex; flex-direction:column; gap:10px; }
  .modal h3 { font-size:17px; }
  .modal input, .modal textarea { width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:10px; font-size:15px; font-family:inherit; }
  .modal .btns { display:flex; gap:8px; justify-content:flex-end; }
  #installBtn { position:absolute; top:calc(12px + env(safe-area-inset-top)); right:12px; padding:7px 10px; border:none; border-radius:10px; background:var(--teal); color:#fff; font-size:12px; font-weight:700; font-family:inherit; }
  /* 地図を大きく(全画面) */
  body.fullmap { overflow:hidden; }
  body.fullmap header { display:none; }
  body.fullmap #mapView { position:fixed; inset:0 0 var(--dockH, 0px) 0; z-index:70; background:var(--bg); max-width:none; margin:0; overflow:hidden;
    padding:calc(8px + env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) 8px max(8px, env(safe-area-inset-left)); gap:6px; display:flex; flex-direction:column; }
  body.fullmap #mapView > :not(.toolbar):not(#hintbar):not(#stage):not(#changedBanner) { display:none !important; }
  body.fullmap .chkrow { display:none; }
  body.fullmap #changedBanner { padding:6px 10px; font-size:12px; }
  body.fullmap .toolbar { padding:6px 8px; gap:6px; }
  body.fullmap .toolbar .chk { font-size:12px; }
  body.fullmap .stage { flex:1; max-height:none; min-height:0; border-radius:10px; }
  body.fullmap .dock { z-index:85; padding:6px 8px calc(6px + env(safe-area-inset-bottom)); max-height:40vh; }
  body.fullmap .dock .in { gap:5px; }
  body.fullmap .dock .name { font-size:14px; }
  body.fullmap .dock .meta { display:none; }
  body.fullmap .dock .btn.small { padding:5px 8px; font-size:12px; }
  body.fullmap .dock .gaps { font-size:12px; }
  body.fullmap .toast { top:calc(70px + env(safe-area-inset-top)); }
  .full-only { display:none; }
  body.fullmap .full-only { display:inline-block; }
  body.fullmap .notfull { display:none; }
  .hintbar { background:#1e293b; color:#fff; border-radius:12px; padding:10px 12px; display:flex; gap:8px; align-items:center; font-size:14px; font-weight:700; }
  .hintbar span { flex:1; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:95; background:#fff; border-radius:18px 18px 0 0; box-shadow:0 -8px 30px rgba(0,0,0,.2);
           max-height:70vh; display:flex; flex-direction:column; padding:12px 12px calc(12px + env(safe-area-inset-bottom)); }
  .sheet .head { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .sheet .head b { flex:1; font-size:16px; }
  .sheet input { width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:10px; font-size:16px; font-family:inherit; margin-bottom:8px; }
  .sheet .list { overflow:auto; }
  #sheetList button { display:flex; width:100%; justify-content:space-between; gap:8px; padding:11px 6px; border:none; border-bottom:1px solid var(--line); background:none; font-family:inherit; font-size:15px; text-align:left; color:var(--ink); }
  #sheetList button small { color:var(--sub); font-size:13px; white-space:nowrap; }
  .sheet-bg { position:fixed; inset:0; background:rgba(15,23,42,.35); z-index:94; }
  @media (max-width:600px){ .toolbar { gap:6px; } .toolbar .btn { padding:7px 10px; font-size:13px; } .toolbar .chk { font-size:12px; } }
  .chkrow { display:flex; gap:12px; flex-basis:100%; }
  .editbar { border:2px solid #fdba74; background:#fff7ed; }
  .editbar .ebl { font-size:12px; font-weight:800; color:#c2410c; }
  .filebar { display:block; line-height:1.7; background:#fff; border-radius:14px; padding:10px 12px; box-shadow:0 1px 3px rgba(0,0,0,.06); font-size:14px; }
  .filebar.changed { background:#fff7ed; border:2px solid #fdba74; }
  .filebar b { font-size:15px; }
  .stepper { display:flex; align-items:center; gap:6px; }
  .stepper button { width:44px; height:40px; border:none; border-radius:10px; background:#e2e8f0; font-size:20px; font-weight:800; font-family:inherit; }
  .stepper b { min-width:64px; text-align:center; font-size:18px; font-variant-numeric:tabular-nums; }
  .pair { display:flex; align-items:center; gap:8px; white-space:nowrap; }
  .lrow { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; margin:6px 0; font-size:14px; }
  .lsec { padding:10px 0; border-bottom:1px solid var(--line); }
  .lsec:last-child { border-bottom:none; }
  .lsec h4 { font-size:14px; margin-bottom:4px; }
  .bigpad { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .bigpad .btn { padding:10px 4px; font-size:15px; text-align:center; }
  .steps { display:flex; gap:4px; align-items:center; font-size:12px; color:var(--sub); }
  .steps button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:4px 9px; font-size:12px; font-family:inherit; }
  .steps button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .preview { position:fixed; inset:0; z-index:96; background:#fff; overflow:auto; padding:calc(10px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom)); }
  .preview .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; position:sticky; top:0; background:#fff; padding-bottom:8px; z-index:2; }
  .preview .bar h2 { flex:1; font-size:16px; min-width:180px; }
  .preview svg { width:100%; height:auto; border:1px solid #cbd5e1; border-radius:8px; display:block; }
  .preview table { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  .preview td, .preview th { border-bottom:1px solid var(--line); padding:6px 4px; text-align:left; }
  #printArea { display:none; }
  @media print {
    @page { size:A4 landscape; margin:8mm; }
    body { padding:0 !important; background:#fff !important; }
    body > *:not(#printArea) { display:none !important; }
    #printArea { display:block !important; color:#000; }
    #printArea h1 { font-size:18pt; margin-bottom:2mm; }
    #printArea .pmeta { font-size:10pt; margin-bottom:3mm; }
    #printArea .ppage { break-after:page; page-break-after:always; height:190mm; overflow:hidden; padding:0; border:none; }
    #printArea .ppage:last-child { break-after:auto; page-break-after:auto; }
    #printArea .pwrap { flex-wrap:nowrap; gap:5mm; }
    #printArea .pfig { flex:0 0 auto; }
    #printArea .pfig svg { width:auto; height:168mm; max-width:185mm; }
    #printArea .pside { font-size:9pt; }
    #printArea th { color:#000 !important; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    #printArea table { border-collapse:collapse; font-size:9pt; flex:1; }
    #printArea td, #printArea th { border:1px solid #999; padding:1mm 2mm; text-align:left; }
    #printArea th { background:#eee; }
  }
  [hidden] { display:none !important; }
  body.maptab .toast { top:auto; bottom:calc(96px + env(safe-area-inset-bottom)); }
  /* ===== 配置図（イメージ画どおりに作り直し） ===== */
  body.maptab header { position:relative; }
  body.maptab { padding-bottom:40px; }
  .statcard { display:flex; align-items:center; justify-content:space-between; gap:8px; background:#fff; border-radius:12px; padding:10px 12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .statcard .nm { font-size:16px; font-weight:900; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .statcard .sb { font-size:12px; color:var(--sub); }
  .statcard .sb.ng { color:#c2410c; font-weight:800; }
  .pill { background:#ccfbf1; color:#115e59; border-radius:999px; padding:5px 10px; font-size:13px; font-weight:800; white-space:nowrap; }
  .edhead { display:flex; align-items:center; gap:6px; background:var(--teal); color:#fff; border-radius:12px; padding:6px; }
  .edhead .t { flex:1; font-size:16px; font-weight:900; }
  .edhead button { height:44px; min-width:44px; border:none; border-radius:10px; background:rgba(255,255,255,.18); color:#fff; font-family:inherit; font-size:15px; font-weight:800; padding:0 10px; }
  .edhead button:disabled { opacity:.4; }
  .prog { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-top:8px; }
  .prog i { height:7px; border-radius:4px; background:#cbd5e1; }
  .prog i.on { background:var(--teal); }
  .stagewrap { position:sticky; top:0; z-index:20; }
  .stage { position:relative; max-height:none; height:46vh; min-height:160px; background:#cbd5d0; border-radius:12px; overflow:auto; box-shadow:0 2px 8px rgba(0,0,0,.12); }
  .stage svg { display:block; margin:0 auto; user-select:none; -webkit-user-select:none; }
  .stage.placing { outline:4px solid var(--sel); }
  .maptgl { position:absolute; right:8px; bottom:8px; display:flex; background:#fff; border-radius:999px; padding:3px; box-shadow:0 1px 4px rgba(0,0,0,.3); z-index:3; }
  .maptgl button { height:38px; padding:0 14px; border:none; border-radius:999px; background:transparent; font-family:inherit; font-size:14px; font-weight:700; color:var(--ink); }
  .maptgl button.on { background:var(--teal); color:#fff; font-weight:900; }
  .zbtn2 { position:absolute; right:8px; top:8px; z-index:3; height:38px; padding:0 12px; border:none; border-radius:10px; background:#fff; font-family:inherit; font-size:13px; font-weight:800; box-shadow:0 1px 4px rgba(0,0,0,.3); }
  .maphint { position:absolute; left:50%; top:8px; transform:translateX(-50%); background:#1e293b; color:#fff; border-radius:999px; padding:8px 14px; font-size:14px; font-weight:800; white-space:nowrap; z-index:3; pointer-events:none; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--sub); align-items:center; }
  .legend span { display:flex; align-items:center; gap:4px; }
  .legend i { display:inline-block; }
  .bigbtn { min-height:58px; border:none; border-radius:14px; background:var(--teal); color:#fff; font-family:inherit; font-size:18px; font-weight:900; width:100%; padding:0 8px; }
  .bigbtn.out { background:#fff; color:var(--teal); border:2px solid var(--teal); font-size:16px; }
  .bigbtn.gray { background:#fff; color:var(--ink); border:2px solid #cbd5e1; font-size:16px; }
  .bigbtn:disabled { opacity:.45; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .foot { display:grid; grid-template-columns:120px 1fr; gap:8px; }
  .linkbtn { border:none; background:none; font-family:inherit; font-size:14px; font-weight:700; color:var(--sub); text-decoration:underline; padding:10px; }
  .qh { font-size:22px; font-weight:900; }
  .pickdir2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pickdir2 button { border:3px solid #cbd5e1; border-radius:16px; background:#fff; padding:10px 6px; font-family:inherit; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:4px; }
  .pickdir2 button.on { border-color:var(--sel); background:#fff7ed; }
  .pickdir2 button b { font-size:18px; }
  .pickdir2 button small { font-size:12px; color:var(--sub); }
  .pickdir2 svg { width:100%; max-width:140px; height:auto; }
  .box { background:#fff; border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:10px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .box .ct { font-size:16px; font-weight:900; }

<script>
/* ===== Firebase読み取り節約(通信の自動休止・再開) 2026-10 =====
   ・画面が見えていない(別タブ・最小化・スマホのスリープ)状態が5分続いたら、リアルタイム監視を止めます
     → 画面に戻ると自動で再開します
   ・夜間(19時〜翌6時)は、30分さわらなければ休止します(モニター出しっぱなし対策)
     → 画面をタップすると再開、朝6時には自動で再開します
   ※このブロックは全アプリ共通です。時間を変えるときは下の数字だけ変えてください */
(function(){
  if(!window.firebase || !firebase.firestore) return;
  var NIGHT_FROM = 19;              // 夜間休止の開始(時)
  var NIGHT_TO   = 6;               // 夜間休止の終了(時)
  var HIDDEN_WAIT = 5*60*1000;      // 見えなくなってから休止するまで(5分)
  var NIGHT_IDLE  = 30*60*1000;     // 夜間、さわらずに休止するまで(30分)

  var subs = [], paused = false, reason = '', hiddenTimer = null, lastInput = Date.now(), overlay = null;
  function isNight(){ var h = new Date().getHours(); return h >= NIGHT_FROM || h < NIGHT_TO; }
  function isVisible(){ return document.visibilityState !== 'hidden'; }

  // onSnapshot(リアルタイム監視)を、止めたり再開したりできる形に包む
  function wrap(proto){
    if(!proto) return;
    var orig = proto.onSnapshot;
    if(!orig || orig.__fsSaver) return;
    var w = function(){
      var s = { ref:this, args:Array.prototype.slice.call(arguments), unsub:null, dead:false };
      s.start = function(){ if(!s.dead && !s.unsub) s.unsub = orig.apply(s.ref, s.args); };
      s.stop  = function(){ if(s.unsub){ try{ s.unsub(); }catch(e){} s.unsub = null; } };
      subs.push(s);
      if(!paused) s.start();
      return function(){ s.dead = true; s.stop(); var i = subs.indexOf(s); if(i >= 0) subs.splice(i, 1); };
    };
    w.__fsSaver = true;
    proto.onSnapshot = w;
  }
  wrap(firebase.firestore.Query && firebase.firestore.Query.prototype);
  wrap(firebase.firestore.CollectionReference && firebase.firestore.CollectionReference.prototype);
  wrap(firebase.firestore.DocumentReference && firebase.firestore.DocumentReference.prototype);

  function showOverlay(){
    if(!document.body) return;
    if(!overlay){
      overlay = document.createElement('div');
      overlay.id = 'fsSaverOverlay';
      overlay.setAttribute('style', 'position:fixed;inset:0;z-index:2147483000;background:rgba(15,23,42,.72);display:flex;align-items:center;justify-content:center;padding:16px;cursor:pointer;');
      overlay.innerHTML = '<div style="background:#fff;color:#1f2937;border-radius:16px;padding:24px 22px;max-width:420px;width:100%;text-align:center;font-family:sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3);">'
        + '<div style="font-size:42px;line-height:1;">💤</div>'
        + '<div style="font-size:20px;font-weight:bold;margin:10px 0 8px;">通信を休止しています</div>'
        + '<div style="font-size:14px;line-height:1.7;color:#4b5563;">夜間(' + NIGHT_FROM + '時〜翌' + NIGHT_TO + '時)は、Firebaseの無料枠を節約するため自動で休止します。<br>朝' + NIGHT_TO + '時に自動で再開します。</div>'
        + '<div style="margin-top:16px;background:#16a34a;color:#fff;border-radius:999px;padding:12px;font-size:16px;font-weight:bold;">👆 タップして再開</div>'
        + '</div>';
      document.body.appendChild(overlay);
    }
    overlay.style.display = 'flex';
  }
  function hideOverlay(){ if(overlay) overlay.style.display = 'none'; }

  function pause(why){
    if(paused) return;
    paused = true; reason = why;
    subs.forEach(function(s){ s.stop(); });
    if(why === 'night') showOverlay();
  }
  function resume(byTap){
    lastInput = Date.now();
    if(!paused) return;
    paused = false; reason = '';
    // タップで再開したときは、そのタップが下のボタンに届かないよう少し待ってから幕を外す
    if(byTap) setTimeout(hideOverlay, 500); else hideOverlay();
    subs.forEach(function(s){ s.start(); });
  }

  // 画面の表示・非表示
  document.addEventListener('visibilitychange', function(){
    if(isVisible()){
      if(hiddenTimer){ clearTimeout(hiddenTimer); hiddenTimer = null; }
      resume(false);
    }else if(!hiddenTimer){
      hiddenTimer = setTimeout(function(){ hiddenTimer = null; if(!isVisible()) pause('hidden'); }, HIDDEN_WAIT);
    }
  });

  // さわったら「使っている」とみなす(休止中なら再開)
  ['pointerdown','touchstart','keydown','wheel'].forEach(function(ev){
    window.addEventListener(ev, function(e){
      if(paused && reason === 'night'){ resume(true); return; }
      lastInput = Date.now();
    }, { capture:true, passive:true });
  });

  // 1分ごとに夜間・朝の判定
  setInterval(function(){
    if(!isVisible()) return;
    if(!paused && isNight() && Date.now() - lastInput > NIGHT_IDLE) pause('night');
    else if(paused && reason === 'night' && !isNight()) resume(false);
  }, 60*1000);

  // 確認用(ブラウザのコンソールで fsSaver.status() と打つと状態が見られます)
  window.fsSaver = {
    status: function(){ return { paused:paused, reason:reason, listeners:subs.length }; },
    pause: function(){ pause('night'); },
    resume: function(){ resume(false); }
  };
})();

</script>

function esc(s){ return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>e.classList.remove("show"),2200); }
function vMainName(v){ return (v.nickname || "").trim() || (v.number || "").trim() || "名称未設定"; }
function nkey(s){ return (s || "").toString().normalize("NFKC").replace(/[\s　]/g, "").toLowerCase(); }
function vKeys(v){ return new Set([v.nickname, v.number].filter(Boolean).map(nkey)); }
function todayStr(d){ d = d || new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function daysUntil(ds){ return Math.round((new Date(ds+"T00:00:00") - new Date(todayStr()+"T00:00:00"))/86400000); }
function ymdJ(ds){ if (!ds) return ""; const [y,m,d] = String(ds).slice(0,10).split("-"); return `${y}年${+m}月${+d}日`; }
function md(ds){ return ds ? String(ds).slice(5,10).replace("-","/").replace(/^0/,"").replace("/0","/") : ""; }
// 題名の中に車の名前があるか(「3t」が「13t」に当たらないように数字の続きは見ない)
function nameInText(name, text){
  const k = nkey(name), t = nkey(text); if (!k) return false;
  let i = t.indexOf(k);
  while (i !== -1){ const b = t[i-1]||"", a = t[i+k.length]||"";
    if (!(/\d/.test(k[0]) && /\d/.test(b)) && !(/\d/.test(k[k.length-1]) && /\d/.test(a))) return true;
    i = t.indexOf(k, i+1); }
  return false;
}

/* ===== 車の大きさ（マスタの長さ・幅cm。なければ車種から仮の大きさ） ===== */
function guessSize(model){
  const m = (model || "").normalize("NFKC");
  if (/軽/.test(m)) return [340,148];
  if (/大型|10t|10トン|トレーラ|セミ/.test(m)) return [1200,249];
  if (/アームロール|脱着|ダンプ|コンテナ/.test(m)) return [700,220];
  if (/パッカー|塵芥|プレス/.test(m)) return [650,220];
  if (/フォーク|リフト|重機|ショベル/.test(m)) return [400,180];
  return [600,200];
}
function vSize(v){
  const L = parseFloat(v.lengthCm), W = parseFloat(v.widthCm);
  if (L > 0 && W > 0) return { L:L/100, W:W/100, temp:false };
  const g = guessSize(v.model);
  return { L:(L>0?L:g[0])/100, W:(W>0?W:g[1])/100, temp:true };
}

/* ======================================================================
   タイヤ(タイヤ管理と同じ考え方で読む)
   ====================================================================== */
const SET_NAME = { winter:"冬タイヤ", summer:"夏タイヤ" }, SET_ICON = { winter:"❄", summer:"☀" };
function seasonOf(ds){ const y=+ds.slice(0,4), m=+ds.slice(5,7); if (m>=9) return "W"+y; if (m<=2) return "W"+(y-1); return "S"+y; }
function seasonRange(k){ const y=+k.slice(1); return k[0]==="W" ? [`${y}-09-01`,`${y+1}-03-01`] : [`${y}-03-01`,`${y}-09-01`]; }
function seasonSet(k){ return k[0]==="W" ? "winter" : "summer"; }
function seasonLabel(k){ const y=+k.slice(1); return k[0]==="W" ? `${y} 冬タイヤ` : `${y} 夏タイヤ`; }
function recKind(r){ return r.kind || "swap"; }
function recSet(r){ return r.set || (r.date ? seasonSet(seasonOf(r.date)) : "summer"); }
function tireTruckOf(v){ const ks = vKeys(v); return tireTrucks.find(t => ks.has(nkey(t.name))) || null; }
function truckRecs(t){ return tireRecs.filter(r => r.truckId === t.id); }
function tireState(t){
  const st = { mounted:null, winter:{ones:[]}, summer:{ones:[]}, storage:"", storageSet:"" };
  truckRecs(t).forEach(r => {
    const s = recSet(r), k = recKind(r), o = st[s];
    if (k === "one"){ o.ones.push({ pos:r.position||"", date:r.date }); return; }
    st.mounted = s;
    if (k === "new"){ o.ones = []; o.year = null; o.tread = null; o.plat = false; }
    if (r.tread != null){ o.tread = r.tread; o.plat = !!r.platform; }
    if (r.mfgYear) o.year = r.mfgYear;
    if (k === "swap"){ st.storageSet = s==="winter"?"summer":"winter"; st.storage = r.storage||""; }
  });
  return st;
}
function seasonDone(t, key){
  const [from,to] = seasonRange(key), want = seasonSet(key);
  const hit = truckRecs(t).filter(r => r.date >= from && r.date < to && recSet(r)===want && recKind(r)!=="check" && recKind(r)!=="one");
  return hit.length ? hit[hit.length-1] : null;
}
function tireAlerts(st){
  const out = [];
  ["winter","summer"].forEach(s => { const o = st[s];
    if (s==="winter" && o.plat) out.push(`${SET_NAME[s]} プラットホームが出ています`);
    else if (o.tread != null){ const r = s==="winter"?TH.winR:TH.sumR; if (r!=null && o.tread <= r) out.push(`${SET_NAME[s]} 溝${o.tread}mm`); }
    if (o.year && TH.ageR!=null && new Date().getFullYear()-o.year >= TH.ageR) out.push(`${SET_NAME[s]} ${o.year}年製`);
  });
  return out;
}
function recText(r){
  const k = recKind(r), s = recSet(r);
  const what = k==="swap" ? `${SET_ICON[s]} ${SET_NAME[s]}に履き替え` : k==="new" ? `🆕 ${SET_NAME[s]}を新品に` : k==="one" ? `🛞 ${SET_NAME[s]} ${r.position||""} 1本だけ交換` : `🔍 点検(${SET_NAME[s]})`;
  const p = [what];
  if (r.shopName) p.push("🏪 "+r.shopName);
  if (k==="swap" && r.storage) p.push("📦 外したタイヤ："+r.storage);
  if (r.tread != null) p.push("溝 "+r.tread+"mm");
  if (r.platform) p.push("プラットホーム露出");
  if (r.mfgYear) p.push(r.mfgYear+"年製");
  if (r.memo) p.push("📝 "+r.memo);
  return p;
}

/* ===== 車検(ISO管理のカレンダーの「車検」) ===== */
function shakenOf(v){
  const ks = vKeys(v), nm = vMainName(v), today = todayStr();
  const mine = shakenEvents.filter(e => e.vehicle ? ks.has(nkey(e.vehicle)) : nameInText(nm, e.text));
  return {
    now: mine.filter(e => e.date <= today && e.end >= today).sort((a,b)=>a.date.localeCompare(b.date))[0] || null,
    next: mine.filter(e => e.date > today).sort((a,b)=>a.date.localeCompare(b.date))[0] || null,
    last: mine.filter(e => e.end < today).sort((a,b)=>b.date.localeCompare(a.date))[0] || null,
    all: mine.sort((a,b)=>b.date.localeCompare(a.date))
  };
}

/* ===== 不具合(ISO管理の「車両の不具合と修理」。点検ラクラクの不具合報告もここに写される) ===== */
const pick = (x, ks) => { for (const k of ks){ const v = x[k]; if (v){ if (v.toDate) return todayStr(v.toDate()); return String(v).slice(0,10); } } return ""; };
function repairDone(x){ return /直した|対応済|完了|済/.test(x.status || "") || x.status === "取消"; }
function repairsOf(v){
  const ks = vKeys(v), nm = vMainName(v);
  return repairs.filter(x => x.vehicle ? (ks.has(nkey(x.vehicle)) || nameInText(nm, x.vehicle)) : false)
    .map(x => ({ x, found: pick(x, ["date","reportDate","foundDate","reportedAt","day","createdAt"]),
                 fixed: pick(x, ["fixedDate","repairDate","doneDate","fixDate","repairedDate","repairedAt","completedDate"]),
                 done: repairDone(x), text: x.content || x.title || x.detail || x.memo || "" }))
    .sort((a,b) => (a.done - b.done) || (b.found||"").localeCompare(a.found||""));
}

/* ===== 1台の注意マーク ===== */
function statusOf(v){
  const out = { defect:0, tire:"", tireLv:"", shaken:null };
  out.defect = repairsOf(v).filter(r => !r.done).length;
  const t = tireTruckOf(v);
  if (t){
    const key = seasonOf(todayStr()), st = tireState(t), al = tireAlerts(st);
    if (al.length){ out.tire = "タイヤ 交換時期"; out.tireLv = "red"; }
    else if (!seasonDone(t, key)){ out.tire = (key[0]==="W"?"冬タイヤ":"夏タイヤ")+" まだ"; out.tireLv = "amber"; }
  }
  const sh = shakenOf(v);
  if (sh.now) out.shaken = { text:"車検中", lv:"blue" };
  else if (sh.next){ const n = daysUntil(sh.next.date); if (n <= 30) out.shaken = { text:`車検 あと${n}日`, lv:"blue" }; }
  return out;
}

// 点検・不具合・タイヤ・車検は、開いたときに1回だけ読む(読み取り回数の節約)。「最新にする」で読み直し
async function loadExtra(){
  $("homeLoaded").textContent = "読み込み中…";
  const from = todayStr(new Date(Date.now() - 800*86400000));
  const tasks = [
    db.collection("tire_trucks").get().then(s => { tireTrucks = s.docs.map(d=>({id:d.id,...d.data()})); }),
    db.collection("tire_records").get().then(s => { tireRecs = s.docs.map(d=>({id:d.id,...d.data()}));
      const ts = r => (r.createdAt && r.createdAt.toMillis) ? r.createdAt.toMillis() : 0;
      tireRecs.sort((a,b) => (a.date||"").localeCompare(b.date||"") || ts(a)-ts(b)); }),
    db.collection("tire_settings").doc("main").get().then(d => { if (d.exists){ const v=d.data(); Object.keys(TH).forEach(k=>{ if (v[k]!==undefined) TH[k]=v[k]; }); } }),
    db.collection("isoEvents").where("date", ">=", from).get().then(s => { shakenEvents = [];
      s.forEach(doc => { const x = doc.data(), text = (x.title||"")+" "+(x.mark||"");
        if (x.date && /車検/.test(text)) shakenEvents.push({ date:x.date, end:(x.endDate && x.endDate > x.date) ? x.endDate : x.date, vehicle:x.vehicle||"", place:x.place||"", text:x.title||"" }); }); }),
    db.collection("isoRegisters").where("reg", "==", "vehRepair").get().then(s => { repairs = s.docs.map(d=>({id:d.id,...d.data()})).filter(x => !x.draft); })
  ];
  const res = await Promise.allSettled(tasks);
  const ng = res.filter(r => r.status === "rejected");
  ng.forEach(r => console.error(r.reason));
  extraLoaded = true; extraTime = new Date();
  $("homeLoaded").textContent = (ng.length ? "⚠️ 一部読み込めませんでした　" : "") + `${String(extraTime.getHours()).padStart(2,"0")}:${String(extraTime.getMinutes()).padStart(2,"0")} に読み込み`;
  refresh();
}

// 点検ラクラクの記録(月ごと。開いた車のカルテで使う)
const tkMonths = {};
function tkLoadMonth(y, m){
  const tag = y+"_"+m;
  if (tkMonths[tag]) return tkMonths[tag];
  if (!tenkenDB) return Promise.resolve({});
  const prefix = "tenken_"+y+"_"+m+"_";
  tkMonths[tag] = tenkenDB.ref("tenkenData").orderByKey().startAt(prefix).endAt(prefix+"").once("value").then(s => s.val() || {}).catch(e => { console.error(e); delete tkMonths[tag]; return {}; });
  return tkMonths[tag];
}

  window.scrollTo(0,0);

}

function tagsHtml(v, s, p){
  const t = [];
  if (s.defect) t.push(`<span class="tag red">不具合 未対応${s.defect>1?" "+s.defect+"件":""}</span>`);
  if (s.tire) t.push(`<span class="tag ${s.tireLv}">${esc(s.tire)}</span>`);
  if (s.shaken) t.push(`<span class="tag ${s.shaken.lv}">${esc(s.shaken.text)}</span>`);
  if (p) t.push(`<span class="tag l${p.lot}">置き場${p.lot==="1"?"①":"②"}${p.fixed?"・確定":""}</span>`);
  if (vSize(v).temp) t.push(`<span class="tag">長さ・幅 未入力</span>`);
  return t.join("");
}

function closeKarte(){ karteId = null; $("karte").hidden = true; document.body.style.overflow = ""; }
$("kBack").onclick = closeKarte;
let karteTk = null;
async function loadKarteTenken(){
  const id = karteId; karteTk = null;
  const now = new Date(), y = now.getFullYear(), m = now.getMonth()+1, py = m===1?y-1:y, pm = m===1?12:m-1;
  const [a,b] = await Promise.all([tkLoadMonth(y,m), tkLoadMonth(py,pm)]);
  if (karteId !== id) return;
  karteTk = Object.assign({}, b, a); renderKarte();
}
function tenkenHtml(v){
  if (!tenkenDB) return `<div class="note">点検ラクラクにつなげませんでした</div>`;
  if (!karteTk) return `<div class="note">点検ラクラクの記録を読み込み中…</div>`;
  const nm = vMainName(v), days = [], bad = [];
  for (let i = 0; i < 14; i++){
    const d = new Date(Date.now() - i*86400000), k = `tenken_${d.getFullYear()}_${d.getMonth()+1}_${d.getDate()}`;
    const r = (karteTk[k] || {})[nm] || null;
    days.push({ d, r });
  }
  Object.keys(karteTk).forEach(k => { const r = (karteTk[k]||{})[nm];
    if (r && r.dailyCheck && r.dailyCheck.badItems && r.dailyCheck.badItems.length){ const p = k.split("_"); bad.push({ ds:`${p[1]}-${String(p[2]).padStart(2,"0")}-${String(p[3]).padStart(2,"0")}`, items:r.dailyCheck.badItems }); } });
  bad.sort((a,b) => b.ds.localeCompare(a.ds));
  const wd = "日月火水木金土";
  const grid = days.slice().reverse().map(({d,r}) => {
    const am = r && r.morning, pmv = r && r.afternoon, dl = r && (r.dailyDone || r.dailyCheck);
    const cls = !r ? "off" : (am && pmv) ? "full" : (am || pmv) ? "half" : "none";
    return `<div class="ck ${cls}" title="${d.getMonth()+1}/${d.getDate()}"><b>${d.getDate()}</b>${wd[d.getDay()]}<br>${am?"午前○":"午前-"}<br>${pmv?"午後○":"午後-"}${dl?"<br>📋":""}</div>`;
  }).join("");
  const last = days.find(x => x.r && (x.r.morning || x.r.afternoon));
  const lastTxt = last ? `${last.d.getMonth()+1}月${last.d.getDate()}日　午前${last.r.morning?"○ "+(last.r.morningTime||"")+" "+(last.r.morningStaff||""):"-"}　午後${last.r.afternoon?"○ "+(last.r.afternoonTime||"")+" "+(last.r.afternoonStaff||""):"-"}` : "この2週間に点検の記録はありません";
  return `<div class="note" style="margin:0 0 6px;">いちばん新しい点検：${esc(lastTxt)}</div>
    <div class="ckgrid">${grid}</div>
    <div class="note">緑＝午前・午後　黄＝片方　赤＝未確認　📋＝日常点検</div>
    ${bad.length ? `<div style="margin-top:8px;"><b style="font-size:13px;color:var(--warn);">日常点検で「否」があった日（先月から）</b><div class="hist">${bad.slice(0,6).map(b => `<div><span class="d">${md(b.ds)}</span><span>${b.items.map(i => esc((i.no?i.no+" ":"")+(i.name||""))).join("、")}</span></div>`).join("")}</div></div>` : ""}`;
}

  $("kBody").innerHTML = `

/* ======================================================================
   配置図：① 向きと幅 → ② 白線を置く → ③ 車を入れる → ④ 線引き図
   保存先 truck_parking/layout の calib(測った辺)・rows(白線の列)・assign(マスに入れた車)
   列：{ lot, x, y(並べ始めの角・写真のピクセル), ang(度), dir:"v"(車が縦)|"h"(車が横), W(マス幅m), L(マス長さm),
         auto, count, flip(前を反対に), no, adj:{ "マス番号":{ d:前後(m・前が＋), a:傾き(度) } } }
   ====================================================================== */
const EDGE_NAMES = {
  "1": { 0:"北フェンス", 1:"北東の角", 2:"国道側（北）", 3:"国道側（中）", 4:"国道側（南）", 5:"南の角", 6:"市道側（南）", 7:"市道側①", 8:"市道側②", 9:"市道側③", 10:"市道側（北）" },
  "2": { 0:"奥（植え込み）", 1:"建物の角", 2:"奥（建物前）", 3:"右端", 4:"道路側（カーブ）", 5:"道路側", 6:"左端" }
};
const DEF_BASE = { "1":0, "2":5 };
const STEPS = ["dir","rows","cars","lines"];
const STEP_T = { dir:"向きと幅", rows:"白線を置く", cars:"車を入れる", lines:"線引き図" };
let step = "dir", selRow = null, selStall = 0, rowMode = "all", target = null, pickQ = "", placing = false, editRowId = null, showCalib = false;
let draft = { dir:"v", W:3.2, L:null };   // L が null のときは「いちばん長い車＋1m」
let mvStep = 0.5, adjStep = 0.1;
try { showPhoto = localStorage.getItem("truck_photo") === "1"; } catch(e){}

function lotCalib(lot){ return (layout.calib || {})[lot] || null; }
function edgeRaw(lot, i){ const P = LOTS[lot].lot; return [P[i], P[(i+1) % P.length]]; }
function edgePx(lot, i){ const [a,b] = edgeRaw(lot,i); return Math.hypot(b[0]-a[0], b[1]-a[1]); }

// 辺：A＝左の角(左右が同じなら上)、u＝AからBの向き、n＝置き場の内側
function edgeInfo(lot, i){

  if (b[0] < a[0] - 0.5 || (Math.abs(b[0]-a[0]) <= 0.5 && b[1] < a[1])) [a,b] = [b,a];

function edgeName(lot, i){ return (EDGE_NAMES[lot] || {})[i] || `辺${i+1}`; }

}

/* ===== 列とマス ===== */

// 1台ずつ：前後にずらす・傾ける

/* ===== マスに入れた車 ===== */
const skey = (rowId, i) => rowId + "_" + i;

}
function fitWhy(v, r){ const sz = vSize(v); if (sz.L > r.L) return "長い"; if ((r.W - sz.W) / 2 < 0.4) return "せまい"; return ""; }
function fitCheck(v, r){
  const sz = vSize(v), side = (r.W - sz.W) / 2, fb = r.L - sz.L;

function allStalls(lot){ const out = []; rowsOf(lot).forEach((r, ri) => { for (let i = 0; i < rowCount(lot, r); i++) out.push({ r, ri, i }); }); return out; }

/* ===== 白線（線引き図）：マスの両わきの線。となりと同じ線は1本にまとめる ===== */
function lotLines(lot){
  const k = ppm(lot), out = [];
  const same = (s, t) => Math.hypot(s[0][0]-t[0][0], s[0][1]-t[0][1]) < 0.05*k && Math.hypot(s[1][0]-t[1][0], s[1][1]-t[1][1]) < 0.05*k;
  rowsOf(lot).forEach((r, ri) => {
    for (let i = 0; i < rowCount(lot, r); i++){
      const p = stallPoly(lot, r, i);
      [[p[0], p[3]], [p[1], p[2]]].forEach(s => { if (!out.some(o => o.rowId === r.id && same(o.seg, s))) out.push({ rowId:r.id, ri, seg:s }); });
    }

  return out;
}
// 0の角から見た位置(m)。a＝はじまり、b＝おわり。[辺にそって, 辺から離れて]
function lineInfo(lot){
  const e = edgeInfo(lot, baseEdge(lot)), k = ppm(lot);

/* ===== 1つ戻す・保存 ===== */
const undoStack = [];
function pushUndo(){ undoStack.push(JSON.parse(JSON.stringify({ rows:layout.rows||{}, assign:layout.assign||{}, calib:layout.calib||{} }))); if (undoStack.length > 50) undoStack.shift(); }
function save(obj, okMsg){
  return LAYOUT.set(Object.assign(obj, { updatedAt: FV.serverTimestamp() }), { merge:true })
    .then(() => { if (okMsg) toast(okMsg); }).catch(e => { console.error(e); toast("⚠️ 保存できませんでした"); });
}
function replaceMaps(next, msg){
  const del = {}, put = {};
  ["rows","assign","calib"].forEach(f => { const cur = layout[f] || {}, nx = next[f] || {};
    del[f] = {}; put[f] = {}; Object.keys(cur).forEach(k => del[f][k] = FV.delete()); Object.entries(nx).forEach(([k,v]) => put[f][k] = v);
    layout[f] = JSON.parse(JSON.stringify(nx)); });
  render(); return save(del).then(() => save(put, msg));
}
function undo(){ const u = undoStack.pop(); if (!u){ toast("戻せる操作はありません"); return; } target = null; replaceMaps(u, "↩ 戻しました"); }
function setRow(id, patch, quiet){ if (!quiet) pushUndo(); layout.rows[id] = Object.assign({}, layout.rows[id], patch); render(); return save({ rows:{ [id]: patch } }); }
function setAdj(id, i, val){
  pushUndo(); const r = layout.rows[id]; r.adj = Object.assign({}, r.adj || {});
  if (val && (Math.abs(val.d) > 0.001 || Math.abs(val.s || 0) > 0.001 || Math.abs(val.a) > 0.001)) r.adj[i] = val; else { delete r.adj[i]; val = null; }
  render(); return save({ rows:{ [id]: { adj:{ [i]: val ? val : FV.delete() } } } });
}
function delRow(id){
  pushUndo(); const as = {};
  Object.keys(layout.assign || {}).forEach(k => { if (k.startsWith(id + "_")){ as[k] = FV.delete(); delete layout.assign[k]; } });
  delete layout.rows[id]; if (selRow === id) selRow = null; target = null; render();
  save(Object.assign({ rows:{ [id]: FV.delete() } }, Object.keys(as).length ? { assign:as } : {}), "列を消しました");
}
function assignTo(rowId, i, vid, quiet){
  if (!quiet) pushUndo(); const as = {}; layout.assign = layout.assign || {};
  if (vid) Object.entries(layout.assign).forEach(([k,v]) => { if (v === vid){ as[k] = FV.delete(); delete layout.assign[k]; } });
  if (vid){ layout.assign[skey(rowId,i)] = vid; as[skey(rowId,i)] = vid; } else { delete layout.assign[skey(rowId,i)]; as[skey(rowId,i)] = FV.delete(); }
  return as;
}
function clearLot(){
  const lot = curTab; pushUndo();
  const next = JSON.parse(JSON.stringify({ rows:layout.rows||{}, assign:layout.assign||{}, calib:layout.calib||{} }));
  Object.entries(next.rows).forEach(([id,r]) => { if (!r || r.lot === lot){ delete next.rows[id]; Object.keys(next.assign).forEach(k => { if (k.startsWith(id+"_")) delete next.assign[k]; }); } });
  if (layout.saved) delete layout.saved[lot];

  replaceMaps(next, "全部消しました");
}

  });

  { const e = edgeInfo(lot, be); el("circle",{cx:e.a[0],cy:e.a[1],r:fs*0.85,fill:"#c2410c","pointer-events":"none"},svg);

// 近くの辺の向きに列をそろえる
function snapRow(id){
  const lot = curTab, r = layout.rows[id], P = LOTS[lot].lot;
  let best = null;
  P.forEach((a, i) => { const b = P[(i+1)%P.length], L = Math.hypot(b[0]-a[0], b[1]-a[1]); if (L / ppm(lot) < 4) return;
    let t = ((r.x-a[0])*(b[0]-a[0]) + (r.y-a[1])*(b[1]-a[1])) / (L*L); t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(r.x-(a[0]+t*(b[0]-a[0])), r.y-(a[1]+t*(b[1]-a[1])));
    if (!best || d < best.d) best = { d, ang: Math.atan2(b[1]-a[1], b[0]-a[0]) * 180/Math.PI }; });
  if (!best) return;
  let cand = [0,90,180,270].map(o => best.ang + o), cur = r.ang, pick = cand[0], md = 999;
  cand.forEach(a => { const d = Math.abs((((a - cur) % 360) + 540) % 360 - 180); if (d < md){ md = d; pick = a; } });
  pick = Math.round(((((pick % 360) + 540) % 360) - 180) * 10) / 10;
  setRow(id, { ang: pick }); toast("近くの辺にそろえました");
}

const SAVES = db.collection("truck_parking_saves");
const LOTJ = l => l==="1" ? "置き場①" : "置き場②";
function lotData(lot){
  const rows = {}, assign = {};
  Object.entries(layout.rows||{}).forEach(([id,r]) => { if (validRow(r) && r.lot===lot){ rows[id] = r;
    Object.entries(layout.assign||{}).forEach(([k,v]) => { if (k.startsWith(id+"_")) assign[k] = v; }); } });
  return { rows, assign, calib: lotCalib(lot) };
}
function sigOf(lot){
  const d = lotData(lot), norm = o => Object.keys(o).sort().map(k => [k, o[k]]);
  const adjS = a => JSON.stringify(Object.keys(a || {}).sort().map(k => [k, a[k].d, a[k].s || 0, a[k].a]));
  return JSON.stringify([norm(Object.fromEntries(Object.entries(d.rows).map(([k,r]) => [k, [r.dir,Math.round(r.x),Math.round(r.y),r.ang,r.W,r.L,r.auto?"a":r.count,r.flip?1:0,adjS(r.adj)]]))), norm(d.assign), d.calib ? [d.calib.edge, d.calib.realM] : null]);
}

// 今の配置を、印刷・保存用の形にまとめる(名前や大きさもそのときの値で残す)
function snapshotOf(lot){
  const k = ppm(lot), items = [];
  rowsOf(lot).forEach(r => { for (let i = 0; i < rowCount(lot, r); i++){
    const poly = stallPoly(lot, r, i), cc = stallCenter(poly), nn = axes(r).n, ang = Math.atan2(nn[1], nn[0]) * 180/Math.PI + adjOf(r, i).a, lab = stallLabel(lot, r.id, i);
    items.push({ kind:"s", id:skey(r.id,i), name:lab, x:cc[0], y:cc[1], r:ang, wM:r.W, lM:r.L, forV:"" });
    const vid = assignOf(r.id, i), v = vid && vehicles.find(x => x.id === vid);
    if (v){ const sz = vSize(v); items.push({ kind:"v", id:v.id, name:vMainName(v), number:v.number||"", model:v.model||"", stall:lab, x:cc[0], y:cc[1], r:stallAngle(lot, r, i), wM:sz.W, lM:sz.L, fixed:true, temp:sz.temp, ng:fitCheck(v, r).ng }); }
  } });
  const d = lotData(lot), e = edgeInfo(lot, baseEdge(lot));
  return { lot, scale: k / LOTS[lot].ppm, margin:{ side:0, front:0 }, items, rows:d.rows, assign:d.assign, calib:d.calib,
    lines: linesHtml(lot, true), base:{ x:e.a[0], y:e.a[1] }, baseEdge: baseEdge(lot),
    linesData: lineInfo(lot).map(l => ({ no:l.no, x0:l.p0[0], y0:l.p0[1], x1:l.p1[0], y1:l.p1[1] })) };
}

async function doSave(overwrite){
  const name = $("smName").value.trim() || "名前なし", memo = $("smMemo").value.trim(), lot = curTab, cur = savedOf(lot);
  const snap = Object.assign(snapshotOf(lot), { name, memo, savedAtMs: Date.now(), savedAt: FV.serverTimestamp() });

  try {

  const vs = snap.items.filter(i=>i.kind==="v").sort((a,b)=>String(a.stall||a.name).localeCompare(String(b.stall||b.name),"ja",{numeric:true}));
  const ns = snap.items.filter(i=>i.kind==="s").length;
  const cars = `<div><b>${ns}マス・車 ${vs.length}台</b></div><table><tr><th>マス</th><th>車</th><th>車番</th><th>長さ×幅</th></tr>${vs.map(v => `<tr><td>${esc(v.stall||"")}</td><td>${esc(v.name)}</td><td>${esc(v.number)}</td><td>${(+v.lM).toFixed(2)}×${(+v.wM).toFixed(2)}m${v.ng?" ⚠":""}</td></tr>`).join("")}</table>`;
  box.innerHTML = `
    <div class="ppage">${pageHead(1, "航空写真の配置図", snap)}<div class="pwrap"><div class="pfig" data-f="photo"></div><div class="pside">${cars}</div></div></div>
    <div class="ppage">${pageHead(2, "線引き図（現場で白線を引く）", snap)}<div class="pwrap"><div class="pfig" data-f="lines"></div><div class="pside">${snap.lines || ""}
      <div><b>現場の手順</b><br>1．0の角にしるしをつける<br>2．辺にそってメジャーで測り、線のはじまりにしるし<br>3．しるしから矢印の向きに、表の長さだけ引く<br>4．引いたら「済」にチェック</div></div></div></div>
    <div class="ppage">${pageHead(3, "配置図", snap)}<div class="pwrap"><div class="pfig" data-f="map"></div><div class="pside">${cars}</div></div></div>`;
  ["photo","lines","map"].forEach(m => box.querySelector(`[data-f="${m}"]`).appendChild(printSvg(snap, m)));
}
// 印刷用の図。mode：photo＝航空写真の上に、lines＝白線と番号だけ、map＝白い紙に車
function printSvg(snap, mode){
  mode = mode || "map";
  const L = LOTS[snap.lot], k = L.ppm * (snap.scale || 1), ph = mode === "photo", hasL = !!(snap.linesData && snap.linesData.length);
  const ink = ph ? "#fff" : "#000";
  const svg = document.createElementNS(NS, "svg");
  let vb = [0, 0, L.w, L.h];
  if (!ph){ const xs = L.lot.map(p=>p[0]), ys = L.lot.map(p=>p[1]), pad = 46;
    const x0 = Math.max(0, Math.min(...xs)-pad), y0 = Math.max(0, Math.min(...ys)-pad); vb = [x0, y0, Math.min(L.w, Math.max(...xs)+pad) - x0, Math.min(L.h, Math.max(...ys)+pad) - y0]; }
  svg.setAttribute("viewBox", vb.join(" ")); svg.setAttribute("xmlns", NS);
  el("rect",{x:vb[0],y:vb[1],width:vb[2],height:vb[3],fill:"#fff"},svg);
  if (ph) el("image",{href:L.img,x:0,y:0,width:L.w,height:L.h,preserveAspectRatio:"none"},svg);
  el("polygon",{points:L.lot.map(p=>p.join(",")).join(" "),fill:"none",stroke:ph?"#facc15":"#000","stroke-width":3,"stroke-linejoin":"round","stroke-dasharray":ph?"10 6":"none"},svg);
  if (L.bldg && !ph){ el("polygon",{points:L.bldg.map(p=>p.join(",")).join(" "),fill:"#ddd",stroke:"#000"},svg);
    const t=el("text",{x:(L.bldg[0][0]+L.bldg[2][0])/2,y:(L.bldg[0][1]+L.bldg[2][1])/2+6,"text-anchor":"middle","font-size":16,"font-weight":700},svg); t.textContent="建物"; }
  const halo = ph ? { stroke:"#000","stroke-width":3,style:"paint-order:stroke" } : {};
  const n=L.lot.length, cx=L.lot.reduce((a,p)=>a+p[0],0)/n, cy=L.lot.reduce((a,p)=>a+p[1],0)/n, cal = snap.calib;
  L.lot.forEach((a,i)=>{ const b=L.lot[(i+1)%n], m=Math.hypot(b[0]-a[0],b[1]-a[1])/k; if (m<4) return;
    const exact = cal && cal.realM > 0 && cal.edge === i;
    if (exact && !ph) el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:"#c2410c","stroke-width":5},svg);
    let mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2; const dx=b[0]-a[0], dy=b[1]-a[1], d=Math.hypot(dx,dy); let nx=-dy/d, ny=dx/d;
    if ((mx-cx)*nx+(my-cy)*ny<0){nx=-nx;ny=-ny;} mx=Math.max(vb[0]+32,Math.min(vb[0]+vb[2]-32,mx+nx*18)); my=Math.max(vb[1]+14,Math.min(vb[1]+vb[3]-10,my+ny*18));
    const t=el("text",Object.assign({x:mx,y:my+5,"text-anchor":"middle","font-size":exact?16:14,"font-weight":exact?900:700,fill:exact&&!ph?"#c2410c":ink},halo),svg); t.textContent = exact ? m.toFixed(2)+"m" : "約"+Math.round(m)+"m"; });
  (L.labels||[]).forEach(([x,y,txt,r])=>{ const t=el("text",Object.assign({x,y,"text-anchor":"middle","font-size":15,fill:ph?"#fff":"#555",transform:`rotate(${r} ${x} ${y})`},halo),svg); t.textContent=txt; });
  const hasCar = it => snap.items.some(v => v.kind==="v" && Math.abs(v.x-it.x)<0.5 && Math.abs(v.y-it.y)<0.5);
  snap.items.filter(i=>i.kind==="s").forEach(it => {
    const w=it.wM*k, l=it.lM*k, g=el("g",{transform:`translate(${it.x} ${it.y}) rotate(${it.r})`},svg);
    el("rect",{x:-l/2,y:-w/2,width:l,height:w,fill:"none",stroke:hasL && !ph ? "none" : ink,"stroke-width":Math.max(2,0.12*k)},g);
    if (mode === "lines" || !hasCar(it)){ const t=el("text",Object.assign({x:0,y:5,"text-anchor":"middle","font-size":mode==="lines"?14:12,"font-weight":700,fill:ph?"#fff":"#888",transform:`rotate(${-it.r})`},halo),g); t.textContent=it.name; }
  });
  if (hasL && !ph){
    snap.linesData.forEach(l => el("line",{x1:l.x0,y1:l.y0,x2:l.x1,y2:l.y1,stroke:"#000","stroke-width":mode==="lines"?Math.max(3,0.2*k):Math.max(2,0.12*k),"stroke-linecap":"round"},svg));
  }
  if (mode !== "lines") snap.items.filter(i=>i.kind==="v").forEach(it => {
    const w=it.wM*k, l=it.lM*k, g=el("g",{transform:`translate(${it.x} ${it.y}) rotate(${it.r})`},svg);
    el("rect",{x:-w/2,y:-l/2,width:w,height:l,rx:2,fill:ph?"rgba(37,99,235,.85)":"#e5e7eb",stroke:ph?"#1e3a8a":"#000","stroke-width":1.5,"stroke-dasharray":it.temp?"5 4":"none"},g);
    el("rect",{x:-w/2,y:-l/2,width:w,height:Math.min(l*0.22,1.6*k),rx:2,fill:ph?"rgba(15,23,42,.7)":"#9ca3af"},g);
    drawLabel(svg, Object.assign({}, it, { fixed:false, temp:false }), w, l, !ph);
  });
  const used = [];
  if (hasL && mode === "lines") snap.linesData.forEach(l => {
    const dx=l.x1-l.x0, dy=l.y1-l.y0, d=Math.hypot(dx,dy)||1; let off = 13, x, y;
    do { x=l.x1+dx/d*off; y=l.y1+dy/d*off; off += 21; } while (used.some(q => Math.hypot(q[0]-x, q[1]-y) < 20) && off < 300);
    used.push([x,y]);
    el("circle",{cx:x,cy:y,r:10,fill:"#000"},svg);
    const t=el("text",{x,y:y+4.5,"text-anchor":"middle","font-size":12,"font-weight":900,fill:"#fff"},svg); t.textContent=l.no; });
  if (snap.base){ el("circle",{cx:snap.base.x,cy:snap.base.y,r:12,fill:"#c2410c",stroke:"#fff","stroke-width":2},svg);
    const t=el("text",{x:snap.base.x,y:snap.base.y+5,"text-anchor":"middle","font-size":14,"font-weight":900,fill:"#fff"},svg); t.textContent="0"; }
  const bx=vb[0]+vb[2]-20-10*k, by=vb[1]+vb[3]-12;
  el("path",{d:`M${bx} ${by-6}V${by}H${bx+10*k}V${by-6}`,fill:"none",stroke:ink,"stroke-width":2},svg);
  const tt=el("text",Object.assign({x:bx+5*k,y:by-9,"text-anchor":"middle","font-size":12,fill:ink},halo),svg); tt.textContent="10m";
  const ng=el("g",{transform:`translate(${vb[0]+vb[2]-24},${vb[1]+30})`},svg); el("path",{d:"M0 -14 L7 8 L0 3 L-7 8Z",fill:ink},ng);
  const nt=el("text",Object.assign({y:-18,"text-anchor":"middle","font-size":12,"font-weight":700,fill:ink},halo),ng); nt.textContent="N";
  return svg;
}
function printSnap(snap){
  if (!snap) return;
  fillPages($("printArea"), snap);
  setTimeout(() => window.print(), 300);
}

// 保存した配置の一覧
let savesCache = [];
async function loadSaves(){
  if ($("savesSheet").hidden || (curTab!=="1" && curTab!=="2")) return;
  $("ssTitle").textContent = `📂 ${LOTJ(curTab)}の保存した案`;
  $("savesList").innerHTML = `<div class="status">読み込み中…</div>`;
  try {
    const s = await SAVES.where("lot","==",curTab).get();
    savesCache = s.docs.map(d=>({ id:d.id, ...d.data() })).sort((a,b)=>(b.savedAtMs||0)-(a.savedAtMs||0));
  } catch(e){ console.error(e); $("savesList").innerHTML = `<div class="status">⚠️ 読み込めませんでした</div>`; return; }
  $("savesList").innerHTML = savesCache.length ? savesCache.map(x => `<div>
      <div class="nm">${esc(x.name||"名前なし")}<small>${fmtDT(x.savedAtMs)}　${(x.items||[]).filter(i=>i.kind==="s").length}マス・車 ${(x.items||[]).filter(i=>i.kind==="v").length}台${x.memo?"　📝 "+esc(x.memo):""}</small></div>
      <button class="btn small" data-sp="${x.id}">見る・印刷</button>
      <button class="btn small main" data-sr="${x.id}">${(savedOf(curTab)||{}).id===x.id ? "開いています" : "開いて直す"}</button>
      <button class="btn small danger" data-sd="${x.id}">消す</button></div>`).join("")
    : `<div class="status" style="padding:8px 0;">まだありません</div>`;
  $("savesList").querySelectorAll("[data-sp]").forEach(b => b.onclick = () => { closeSavesSheet(); openPreview(savesCache.find(x=>x.id===b.dataset.sp)); });
  $("savesList").querySelectorAll("[data-sr]").forEach(b => b.onclick = () => {
    const id = b.dataset.sr, sv = savedOf(curTab);
    if (sv && sv.id === id && !changedOf(curTab)){ closeSavesSheet(); return; }
    if (changedOf(curTab) && b.dataset.arm !== "1"){ b.dataset.arm = "1"; b.textContent = "未保存の変更が消えます。もう一度"; setTimeout(() => { b.dataset.arm = ""; loadSaves(); }, 3500); return; }
    restoreSnap(savesCache.find(x=>x.id===id)); closeSavesSheet(); });
  armBtns("[data-sd]", "sd", "本当に消す", async id => { try { await SAVES.doc(id).delete();
      const sv = savedOf(curTab); if (sv && sv.id === id){ delete layout.saved[curTab]; await save({ saved:{ [curTab]: FV.delete() } }); render(); }
      toast("消しました"); loadSaves(); } catch(e){ toast("⚠️ 消せませんでした"); } });
}
function armBtns(sel, key, txt, fn){
  $("savesList").querySelectorAll(sel).forEach(b => { const orig = b.textContent;
    b.onclick = () => { const id = b.dataset[key];
      if (b.dataset.arm !== "1"){ b.dataset.arm = "1"; b.textContent = txt; setTimeout(() => { b.dataset.arm = ""; b.textContent = orig; }, 2500); return; }
      fn(id); }; });
}
function openSavesSheet(){ $("savesSheet").hidden = false; $("sheetBg").hidden = false; loadSaves(); }
function closeSavesSheet(){ $("savesSheet").hidden = true; $("sheetBg").hidden = true; }
$("ssClose").onclick = closeSavesSheet; $("sheetBg").onclick = closeSavesSheet;
function restoreSnap(snap){
  if (!snap) return;
  if (!snap.rows){ toast("古い形式の保存なので開けません"); return; }
  pushUndo();
  const lot = snap.lot, next = JSON.parse(JSON.stringify({ rows:layout.rows||{}, assign:layout.assign||{}, calib:layout.calib||{} }));
  Object.entries(next.rows).forEach(([id,r]) => { if (r.lot === lot){ delete next.rows[id]; Object.keys(next.assign).forEach(k => { if (k.startsWith(id+"_")) delete next.assign[k]; }); } });
  const vIds = new Set(vehicles.map(v=>v.id));
  Object.assign(next.rows, snap.rows || {});
  Object.entries(snap.assign || {}).forEach(([k,v]) => { if (!vIds.has(v)) return;
    Object.keys(next.assign).forEach(x => { if (next.assign[x] === v) delete next.assign[x]; }); next.assign[k] = v; });
  if (snap.calib) next.calib[lot] = snap.calib;
  target = null; selRow = null;
  replaceMaps(next, "開きました").then(() => {
    const sv = { sig: sigOf(lot), at: snap.savedAtMs, name: snap.name||"", memo: snap.memo||"", id: snap.id||"" };
    layout.saved = layout.saved || {}; layout.saved[lot] = sv; render(); save({ saved:{ [lot]: sv } });
  });
}


/* ===== ホーム画面に追加 ===== */
let deferredPrompt = null;
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function showInstall(){ $("installBtn").hidden = isStandalone() || !(deferredPrompt || isIOS); }
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; showInstall(); });
window.addEventListener("appinstalled", () => { deferredPrompt = null; showInstall(); toast("✅ ホーム画面に追加しました"); });
$("installBtn").onclick = async () => {
  if (deferredPrompt){ deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch(e){} deferredPrompt = null; showInstall(); }
  else $("iosModal").hidden = false;
};
$("iosClose").onclick = () => { $("iosModal").hidden = true; };
showInstall();

loadExtra();
